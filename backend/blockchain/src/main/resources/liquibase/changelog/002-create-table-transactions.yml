databaseChangeLog:
  - changeSet:
      id: 002-create-table-transactions
      author: Roman
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: block_id
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: poll_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: student_id
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: option_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: timestamp
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: block_id
            constraintName: fk_block
            referencedTableName: blocks
            referencedColumnNames: id
            onDelete: CASCADE

        - createIndex:
            indexName: idx_transactions_block_id
            tableName: transactions
            columns:
              - column:
                  name: block_id
