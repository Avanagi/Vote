databaseChangeLog:
  - changeSet:
      id: 001-create-table-blocks
      author: Roman
      changes:
        - createTable:
            tableName: blocks
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: index
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: previous_hash
                  type: VARCHAR(1024)
                  constraints:
                    nullable: false
              - column:
                  name: hash
                  type: VARCHAR(1024)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: proposer_public_key
                  type: VARCHAR(1024)
                  constraints:
                    nullable: true
              - column:
                  name: signature
                  type: VARCHAR(2048)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - createIndex:
            indexName: idx_blocks_index
            tableName: blocks
            columns:
              - column:
                  name: index