databaseChangeLog:
  - changeSet:
      id: 001-create-table-students
      author: Roman
      changes:
        - createTable:
            tableName: students
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(15)
                  constraints:
                    nullable: false

              - column:
                  name: surname
                  type: VARCHAR(15)
                  constraints:
                    nullable: false

              - column:
                  name: last_name
                  type: VARCHAR(15)
                  constraints:
                    nullable: false

              - column:
                  name: age
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: sex
                  type: VARCHAR(10)
                  constraints:
                    nullable: false

              - column:
                  name: student_group
                  type: VARCHAR(10)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

              - column:
                  name: last_updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
