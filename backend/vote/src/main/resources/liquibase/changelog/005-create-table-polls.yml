databaseChangeLog:
  - changeSet:
      id: 005-create-table-polls
      author: Roman
      changes:
        - createTable:
            tableName: polls
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: question
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: NOW()
