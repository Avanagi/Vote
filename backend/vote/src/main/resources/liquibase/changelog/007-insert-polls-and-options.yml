databaseChangeLog:
  - changeSet:
      id: 007-insert-polls-and-options
      author: Roman
      changes:
        - insert:
            tableName: polls
            columns:
              - column: { name: id, value: 1 }
              - column: { name: question, value: "Какой ваш любимый цвет?" }
              - column: { name: created_at, valueComputed: NOW() }

        - insert:
            tableName: options
            columns:
              - column: { name: id, value: 1 }
              - column: { name: poll_id, value: 1 }
              - column: { name: option_text, value: "Красный" }

        - insert:
            tableName: options
            columns:
              - column: { name: id, value: 2 }
              - column: { name: poll_id, value: 1 }
              - column: { name: option_text, value: "Синий" }

        - insert:
            tableName: options
            columns:
              - column: { name: id, value: 3 }
              - column: { name: poll_id, value: 1 }
              - column: { name: option_text, value: "Зелёный" }
