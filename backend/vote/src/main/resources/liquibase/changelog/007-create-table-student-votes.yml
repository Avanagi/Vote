databaseChangeLog:
  - changeSet:
      id: 007-create-table-student-votes
      author: Roman
      changes:
        - createTable:
            tableName: user_poll
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: poll_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: user_poll
            baseColumnNames: user_id
            referencedTableName: students
            referencedColumnNames: id
            constraintName: fk_user_poll_user_id

        - addForeignKeyConstraint:
            baseTableName: user_poll
            baseColumnNames: poll_id
            referencedTableName: polls
            referencedColumnNames: id
            constraintName: fk_user_poll_poll_id